openapi: 3.0.3
info:
  title: Confluencr Transaction Ledger API
  version: 1.0.0
  description: >-
    Assessment API. Authentication is excluded. Monetary inputs and outputs are
    decimal strings. Duplicate references return 409 with the original posting;
    no automatic retries are performed. If a connection fails around commit,
    reconcile using the same reference rather than generating a new one.
servers:
  - url: http://localhost:3000
tags:
  - name: Accounts
  - name: Transactions
  - name: Transfers
  - name: Operations
paths:
  /accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account with zero balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  pattern: '^[^\u0000]*$'
                  description: Trimmed before validation; must contain non-whitespace text.
            example: { name: John Doe }
      responses:
        '201':
          description: Created; ID and creation time are generated by PostgreSQL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Validation' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '500': { $ref: '#/components/responses/ServerError' }
  /accounts/{id}/balance:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: Get the current stored balance
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                type: object
                required: [account_id, balance]
                properties:
                  account_id: { type: string, format: uuid }
                  balance: { $ref: '#/components/schemas/Balance' }
              example:
                {
                  account_id: '78b965fe-f8bf-4a6b-af85-c3a144d8c582',
                  balance: '100.00',
                }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/MissingAccount' }
        '500': { $ref: '#/components/responses/ServerError' }
  /accounts/{id}/transactions:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    post:
      tags: [Transactions]
      operationId: addTransaction
      summary: Atomically add a credit or debit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInput' }
            example:
              {
                type: credit,
                amount: '100.00',
                description: Initial deposit,
                reference_id: deposit-001,
              }
      responses:
        '201':
          description: Committed transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/MissingAccount' }
        '409':
          description: DUPLICATE_TRANSACTION; details contains the existing transaction even if the new payload differs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422':
          description: INSUFFICIENT_BALANCE; neither ledger nor balance changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  {
                    code: INSUFFICIENT_BALANCE,
                    message: Insufficient balance for this debit,
                    details: [],
                  }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Transactions]
      operationId: getTransactionHistory
      summary: Get immutable postings sorted by created_at DESC, id DESC
      description: >-
        Unknown query properties are rejected. Page and count queries use
        READ COMMITTED and may observe adjacent committed snapshots during writes.
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [credit, debit] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 2147483647, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: History and filtered totals; empty result has zero total pages.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  pagination:
                    type: object
                    required: [page, limit, total_records, total_pages]
                    properties:
                      page: { type: integer, minimum: 1 }
                      limit: { type: integer, minimum: 1, maximum: 100 }
                      total_records: { type: integer, minimum: 0 }
                      total_pages: { type: integer, minimum: 0 }
              example:
                {
                  data: [],
                  pagination:
                    { page: 1, limit: 20, total_records: 0, total_pages: 0 },
                }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/MissingAccount' }
        '500': { $ref: '#/components/responses/ServerError' }
  /transfers:
    post:
      tags: [Transfers]
      operationId: transferMoney
      summary: Atomically transfer between distinct accounts
      description: >-
        Both accounts are locked sequentially in canonical UUID order. The source
        and reference uniquely identify the transfer, independent of destination
        or amount. Repeating that reference returns 409 even with changed payload.
        Both generated ledger entries share a transfer_id. Their references use
        the reserved transfer/ prefix; the user reference is on transfer metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInput' }
            example:
              from_account_id: '78b965fe-f8bf-4a6b-af85-c3a144d8c582'
              to_account_id: '3605b601-3da6-49eb-b3d7-a91081828d38'
              amount: '30.00'
              reference_id: transfer-001
      responses:
        '201':
          description: Committed transfer and its debit/credit pair
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Transfer' }
                  - type: object
                    required: [transactions]
                    properties:
                      transactions:
                        type: array
                        minItems: 2
                        maxItems: 2
                        items: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/MissingAccount' }
        '409':
          description: DUPLICATE_TRANSFER; details contains original transfer metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422':
          description: INSUFFICIENT_BALANCE; neither account nor ledger changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }
  /health:
    get:
      tags: [Operations]
      operationId: health
      summary: Process availability without a database dependency
      responses:
        '200':
          description: Process available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /ready:
    get:
      tags: [Operations]
      operationId: readiness
      summary: Verify connectivity, required ledger migrations and read access
      responses:
        '200':
          description: Database available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ready] }
        '503':
          description: DATABASE_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: UUID; invalid syntax returns INVALID_ACCOUNT_ID.
  schemas:
    Amount:
      type: string
      pattern: '^(?!0(?:\.0{1,2})?$)(?:0|[1-9]\d{0,15})(?:\.\d{1,2})?$'
      description: >-
        Positive decimal string, at most 9999999999999999.99; zero, negative,
        exponent notation, numeric JSON values, whitespace and leading zeros
        are rejected. One or two fractional digits or an integer are accepted.
      example: '100.50'
    Balance:
      type: string
      pattern: '^(?:0|[1-9]\d{0,15})\.\d{2}$'
      example: '100.00'
    Reference:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[^\u0000]*$'
      description: Required nonblank reference. Case and whitespace are preserved exactly; uniqueness is per account.
    Account:
      type: object
      required: [id, name, balance, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        balance: { $ref: '#/components/schemas/Balance' }
        created_at: { type: string, format: date-time }
    TransactionInput:
      type: object
      additionalProperties: false
      required: [type, amount, reference_id]
      properties:
        type: { type: string, enum: [credit, debit] }
        amount: { $ref: '#/components/schemas/Amount' }
        description:
          type: string
          maxLength: 2000
          pattern: '^[^\u0000]*$'
          description: Nonblank text is preserved. If omitted, empty or whitespace-only, the backend generates Credit transaction or Debit transaction. Explicit null is rejected.
        reference_id:
          allOf:
            - { $ref: '#/components/schemas/Reference' }
          description: User references cannot start with the reserved transfer/ prefix.
    TransferInput:
      type: object
      additionalProperties: false
      required: [from_account_id, to_account_id, amount, reference_id]
      properties:
        from_account_id: { type: string, format: uuid }
        to_account_id:
          {
            type: string,
            format: uuid,
            description: Must differ from source after UUID case normalization.,
          }
        amount: { $ref: '#/components/schemas/Amount' }
        reference_id: { $ref: '#/components/schemas/Reference' }
    Transfer:
      type: object
      required:
        [id, from_account_id, to_account_id, amount, reference_id, created_at]
      properties:
        id: { type: string, format: uuid }
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Amount' }
        reference_id: { $ref: '#/components/schemas/Reference' }
        created_at: { type: string, format: date-time }
    Transaction:
      type: object
      required:
        [
          id,
          account_id,
          type,
          amount,
          description,
          reference_id,
          created_at,
          transfer_id,
        ]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        type: { type: string, enum: [credit, debit] }
        amount:
          allOf:
            - { $ref: '#/components/schemas/Amount' }
          description: Output always has two fractional digits.
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: >-
            Nonblank for newly created entries. Standalone postings preserve supplied
            text or receive Credit transaction / Debit transaction. Transfer entries
            receive Transfer to <destination name> / Transfer from <source name>.
            Null is retained only for historical immutable rows created before the
            description requirement.
        reference_id: { $ref: '#/components/schemas/Reference' }
        created_at: { type: string, format: date-time }
        transfer_id:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: Null for standalone postings.,
          }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION_ERROR,
                  INVALID_ACCOUNT_ID,
                  ACCOUNT_NOT_FOUND,
                  DUPLICATE_TRANSACTION,
                  DUPLICATE_TRANSFER,
                  INSUFFICIENT_BALANCE,
                  INVALID_PAGINATION,
                  DATABASE_ERROR,
                  INTERNAL_SERVER_ERROR,
                  DATABASE_UNAVAILABLE,
                  NOT_FOUND,
                ]
            message: { type: string }
            details:
              type: array
              items: {}
              description: Validation issues or the original transaction for duplicates; empty for other errors.
  responses:
    Validation:
      description: VALIDATION_ERROR, INVALID_ACCOUNT_ID or INVALID_PAGINATION.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MissingAccount:
      description: ACCOUNT_NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BodyTooLarge:
      description: VALIDATION_ERROR; request body exceeds 16 KiB.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMedia:
      description: VALIDATION_ERROR; unsupported content type.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: >-
        Sanitized DATABASE_ERROR or INTERNAL_SERVER_ERROR. Overflow and database
        timeouts fail atomically. Network failure around COMMIT may have an unknown
        outcome; reconcile with the same reference. No automatic retries.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
