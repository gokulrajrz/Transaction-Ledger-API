openapi: 3.0.3
info:
  title: Confluencr Transaction Ledger API
  version: 1.0.0
  description:
    Accounts, immutable postings and atomic money transfers. All monetary inputs/outputs are decimal
    strings. This assessment implementation has no authentication or authorization. POST operations create
    actual records. Reuse reference_id to reconcile ambiguous outcomes; duplicates return 409 with the
    original resource. See the repository API reference for validation, failure recovery and operational
    semantics.
  contact:
    name: Project source and issue tracker
    url: https://github.com/gokulrajrz/Transaction-Ledger-API
servers:
  - url: /
    description: Current API origin (interactive documentation)
  - url: http://127.0.0.1:3000
    description: Local development default
tags:
  - name: Accounts
    description: Create accounts and read exact committed balances.
  - name: Transactions
    description: Post credits/debits and read immutable, filtered ledger history.
  - name: Transfers
    description: Atomically move money between two accounts with source-scoped idempotency.
  - name: Operations
    description: Process health and database/schema read readiness.
paths:
  /accounts:
    post:
      tags:
        - Accounts
      operationId: createAccount
      summary: Create an account with zero balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountInput'
            examples:
              CreateAlice:
                $ref: '#/components/examples/CreateAlice'
              CreateBob:
                $ref: '#/components/examples/CreateBob'
      responses:
        '201':
          description: Created account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                AccountCreated:
                  $ref: '#/components/examples/AccountCreated'
        '400':
          $ref: '#/components/responses/Validation'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
      description:
        Create an account. Only name is accepted; it is trimmed and validated before database access. The
        database generates id and created_at and initial balance is always 0.00. Names need not be unique.
        Repeating this request creates another account; account creation has no reference-based idempotency.
  /accounts/{id}/balance:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags:
        - Accounts
      operationId: getAccountBalance
      summary: Get the current stored balance
      responses:
        '200':
          description: Current account balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
              examples:
                BalanceRead:
                  $ref: '#/components/examples/BalanceRead'
        '400':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/MissingAccount'
        '500':
          $ref: '#/components/responses/ServerError'
      description:
        Return the committed balance observed by this read. Malformed path UUIDs return 400; missing
        accounts return 404. Money remains a decimal string.
  /accounts/{id}/transactions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags:
        - Transactions
      operationId: addTransaction
      summary: Atomically add a credit or debit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
            examples:
              CreditInput:
                $ref: '#/components/examples/CreditInput'
              DebitInput:
                $ref: '#/components/examples/DebitInput'
              GeneratedCreditInput:
                $ref: '#/components/examples/GeneratedCreditInput'
      responses:
        '201':
          description: Committed immutable entry. Read the balance endpoint separately for the resulting account balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              examples:
                CreditCreated:
                  $ref: '#/components/examples/CreditCreated'
                DebitCreated:
                  $ref: '#/components/examples/DebitCreated'
                GeneratedCreditCreated:
                  $ref: '#/components/examples/GeneratedCreditCreated'
        '400':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/MissingAccount'
        '409':
          description: DUPLICATE_TRANSACTION. details[0] is the original transaction; the new payload has not been posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingConflict'
              examples:
                DuplicatePosting:
                  $ref: '#/components/examples/DuplicatePosting'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/InsufficientBalance'
        '500':
          $ref: '#/components/responses/ServerError'
      description:
        Lock the account, check its exact reference, verify debit funds, insert an immutable entry and
        adjust balance in one SQL transaction. Duplicate checks follow request validation/account existence
        and precede the funds check. Same account/reference returns 409 with the original entry even if a new
        valid payload differs. Same reference on another account is allowed. Missing/blank descriptions are
        generated. The transfer/ reference prefix is reserved.
    get:
      tags:
        - Transactions
      operationId: getTransactionHistory
      summary: Get immutable postings sorted by created_at DESC, id DESC
      description:
        Offset pagination with an optional exact type filter. Results sort by created_at DESC, id DESC.
        All query fields are validated before account existence is checked; unknown keys and
        repeated/malformed parameters are rejected. Filtered counts and page data can observe adjacent READ
        COMMITTED snapshots during concurrent writes. Existing historical null/blank descriptions are
        preserved.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              - credit
              - debit
          description: Optional exact lowercase type. Omit it for both types. Invalid query fields use INVALID_PAGINATION.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
            default: 1
          description: Positive decimal integer string in the URL, without signs, leading zeros, fractions or exponents.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Positive decimal integer string; 1–100. Unknown/repeated query keys are rejected.
      responses:
        '200':
          description: Latest-first page and totals for the same filter. Empty histories have zero total pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistory'
              examples:
                HistoryPage:
                  $ref: '#/components/examples/HistoryPage'
                CreditHistory:
                  $ref: '#/components/examples/CreditHistory'
                HistorySecondPage:
                  $ref: '#/components/examples/HistorySecondPage'
                EmptyHistory:
                  $ref: '#/components/examples/EmptyHistory'
                LegacyHistory:
                  $ref: '#/components/examples/LegacyHistory'
        '400':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/MissingAccount'
        '500':
          $ref: '#/components/responses/ServerError'
  /transfers:
    post:
      tags:
        - Transfers
      operationId: transferMoney
      summary: Atomically transfer between distinct accounts
      description:
        Both accounts must exist and differ after UUID normalization. The backend locks them sequentially
        in canonical UUID order, checks source/reference idempotency, verifies funds and commits metadata,
        both balances and both ledger entries together. Both existence checks precede duplicate lookup. For
        otherwise valid input, repeated source/reference returns 409 with original metadata even when
        amount/destination differ. Descriptions name the counterparty. The user reference belongs to metadata;
        generated entry references use transfer/<uuid>/debit and transfer/<uuid>/credit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferInput'
            examples:
              TransferInput:
                $ref: '#/components/examples/TransferInput'
      responses:
        '201':
          description:
            Committed metadata plus source debit then destination credit. Use balance endpoints to read
            resulting balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferCreated'
              examples:
                TransferCreated:
                  $ref: '#/components/examples/TransferCreated'
        '400':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/MissingAccount'
        '409':
          description: DUPLICATE_TRANSFER. details[0] contains original metadata without a transactions array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferConflict'
              examples:
                DuplicateTransfer:
                  $ref: '#/components/examples/DuplicateTransfer'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/InsufficientBalance'
        '500':
          $ref: '#/components/responses/ServerError'
  /health:
    get:
      tags:
        - Operations
      operationId: health
      summary: Process availability without a database dependency
      responses:
        '200':
          description: Process is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                Healthy:
                  $ref: '#/components/examples/Healthy'
      description: Process availability only; does not query the database.
  /ready:
    get:
      tags:
        - Operations
      operationId: readiness
      summary: Verify connectivity, required ledger migrations and read access
      responses:
        '200':
          description: Database/schema read check succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              examples:
                Ready:
                  $ref: '#/components/examples/Ready'
        '503':
          description: Database connection or required schema read check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessError'
              examples:
                DatabaseUnavailable:
                  $ref: '#/components/examples/DatabaseUnavailable'
      description:
        Verify database connectivity and read access to required ledger tables/columns. This is not a
        complete write-privilege or funds check. No Retry-After header is configured.
components:
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID; invalid syntax returns INVALID_ACCOUNT_ID.
  schemas:
    Amount:
      type: string
      pattern: ^(?!0(?:\.0{1,2})?$)(?:0|[1-9]\d{0,15})(?:\.\d{1,2})?$
      description:
        Positive decimal string, at most 9999999999999999.99; zero, negative, exponent notation, numeric
        JSON values, whitespace and leading zeros are rejected. One or two fractional digits or an integer are
        accepted.
      example: '100.50'
      maxLength: 19
    Balance:
      type: string
      pattern: ^(?:0|[1-9]\d{0,15})\.\d{2}$
      example: '100.00'
    Reference:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^(?=[\s\S]*\S)[^\u0000]+$
      description: Required nonblank reference. Case and whitespace are preserved exactly; uniqueness is per account.
    Account:
      type: object
      required:
        - id
        - name
        - balance
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[^\u0000]*$
        balance:
          $ref: '#/components/schemas/Balance'
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    TransactionInput:
      type: object
      additionalProperties: false
      required:
        - type
        - amount
        - reference_id
      properties:
        type:
          type: string
          enum:
            - credit
            - debit
        amount:
          $ref: '#/components/schemas/Amount'
        description:
          type: string
          maxLength: 2000
          pattern: ^[^\u0000]*$
          description:
            Optional text, maximum 2,000 characters. Nonblank text is preserved. Missing, empty or
            whitespace-only input receives Credit transaction or Debit transaction. Explicit JSON null is
            rejected.
        reference_id:
          $ref: '#/components/schemas/PostingReference'
    TransferInput:
      type: object
      additionalProperties: false
      required:
        - from_account_id
        - to_account_id
        - amount
        - reference_id
      properties:
        from_account_id:
          type: string
          format: uuid
        to_account_id:
          type: string
          format: uuid
          description: Must differ from source after UUID case normalization.
        amount:
          $ref: '#/components/schemas/Amount'
        reference_id:
          $ref: '#/components/schemas/Reference'
    Transfer:
      type: object
      required:
        - id
        - from_account_id
        - to_account_id
        - amount
        - reference_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        from_account_id:
          type: string
          format: uuid
        to_account_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        reference_id:
          $ref: '#/components/schemas/Reference'
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    Transaction:
      type: object
      required:
        - id
        - account_id
        - type
        - amount
        - description
        - reference_id
        - created_at
        - transfer_id
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - credit
            - debit
        amount:
          $ref: '#/components/schemas/Money'
        description:
          type: string
          nullable: true
          maxLength: 2000
          description:
            'Nonblank on new entries: supplied text or Credit transaction / Debit transaction; transfers use
            Transfer to <destination name> / Transfer from <source name>. Original historical null/blank
            values remain immutable and may appear in history or duplicate responses.'
        reference_id:
          $ref: '#/components/schemas/Reference'
        created_at:
          type: string
          format: date-time
        transfer_id:
          type: string
          format: uuid
          nullable: true
          description: Null for standalone postings.
      additionalProperties: false
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - INVALID_ACCOUNT_ID
                - ACCOUNT_NOT_FOUND
                - DUPLICATE_TRANSACTION
                - DUPLICATE_TRANSFER
                - INSUFFICIENT_BALANCE
                - INVALID_PAGINATION
                - DATABASE_ERROR
                - INTERNAL_SERVER_ERROR
                - DATABASE_UNAVAILABLE
                - NOT_FOUND
            message:
              type: string
              minLength: 1
            details:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/ValidationIssue'
                  - $ref: '#/components/schemas/Transaction'
                  - $ref: '#/components/schemas/Transfer'
              description: Validation issues, one original posting/transfer, or an empty array for other errors.
          additionalProperties: false
      additionalProperties: false
    Money:
      type: string
      pattern: ^(?!0\.00$)(?:0|[1-9]\d{0,15})\.\d{2}$
      description: Positive NUMERIC(18,2) output serialized with exactly two fractional digits.
      example: '100.00'
    PostingReference:
      allOf:
        - $ref: '#/components/schemas/Reference'
        - type: string
          pattern: ^(?!transfer/)[\s\S]*$
      description: Exact account-scoped reference. The transfer/ prefix is reserved for generated transfer entries.
    CreateAccountInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          pattern: ^(?![\s\S]*\u0000)(?=[\s\S]*\S)\s*[\s\S]{1,200}\s*$
          description:
            Required nonblank name. Leading/trailing whitespace is trimmed before the 1–200 character bound
            is checked. NUL is rejected.
          example: Alice
    BalanceResponse:
      type: object
      additionalProperties: false
      required:
        - account_id
        - balance
      properties:
        account_id:
          type: string
          format: uuid
        balance:
          $ref: '#/components/schemas/Balance'
    TransferCreated:
      type: object
      required:
        - id
        - from_account_id
        - to_account_id
        - amount
        - reference_id
        - created_at
        - transactions
      properties:
        id:
          type: string
          format: uuid
        from_account_id:
          type: string
          format: uuid
        to_account_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        reference_id:
          $ref: '#/components/schemas/Reference'
        created_at:
          type: string
          format: date-time
        transactions:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/Transaction'
          description: Source debit first, destination credit second. Both entries share this transfer id.
      additionalProperties: false
    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - limit
        - total_records
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          maximum: 2147483647
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total_records:
          type: integer
          minimum: 0
          description: Count after applying the optional type filter.
        total_pages:
          type: integer
          minimum: 0
          description: ceil(total_records / limit); zero when the filtered history is empty.
    TransactionHistory:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Transaction'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
        - path
        - message
      properties:
        path:
          type: string
          description: Field path; an empty string indicates the body or object itself.
        message:
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - INVALID_ACCOUNT_ID
                - INVALID_PAGINATION
            message:
              type: string
              minLength: 1
            details:
              type: array
              items:
                $ref: '#/components/schemas/ValidationIssue'
    AccountNotFoundError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - ACCOUNT_NOT_FOUND
            message:
              type: string
              minLength: 1
            details:
              type: array
              maxItems: 0
              items: {}
    InsufficientBalanceError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - INSUFFICIENT_BALANCE
            message:
              type: string
              minLength: 1
            details:
              type: array
              maxItems: 0
              items: {}
    PostingConflict:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - DUPLICATE_TRANSACTION
            message:
              type: string
              minLength: 1
            details:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/Transaction'
    TransferConflict:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - DUPLICATE_TRANSFER
            message:
              type: string
              minLength: 1
            details:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/Transfer'
    ServerError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - DATABASE_ERROR
                - INTERNAL_SERVER_ERROR
            message:
              type: string
              minLength: 1
            details:
              type: array
              maxItems: 0
              items: {}
    ReadinessError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - DATABASE_UNAVAILABLE
            message:
              type: string
              minLength: 1
            details:
              type: array
              maxItems: 0
              items: {}
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Readiness:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
  responses:
    Validation:
      description: Invalid request body, account path UUID or history query. Use the error code and details field paths.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            ValidationAmount:
              $ref: '#/components/examples/ValidationAmount'
            InvalidUuid:
              $ref: '#/components/examples/InvalidUuid'
            InvalidPagination:
              $ref: '#/components/examples/InvalidPagination'
    MissingAccount:
      description: ACCOUNT_NOT_FOUND. No new financial state was committed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountNotFoundError'
          examples:
            MissingAccount:
              $ref: '#/components/examples/MissingAccount'
    BodyTooLarge:
      description: Request body exceeds 16 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            MalformedBody:
              $ref: '#/components/examples/MalformedBody'
    UnsupportedMedia:
      description: Unsupported request content type. Send application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            MalformedBody:
              $ref: '#/components/examples/MalformedBody'
    ServerError:
      description:
        'Sanitized database/unexpected failure. Confirmed rollback failures preserve state. A connection
        failure around COMMIT can have an unknown outcome: reconcile with the same reference; no automatic
        retries are performed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerError'
          examples:
            DatabaseFailure:
              $ref: '#/components/examples/DatabaseFailure'
            InternalFailure:
              $ref: '#/components/examples/InternalFailure'
    InsufficientBalance:
      description: INSUFFICIENT_BALANCE. The debit/transfer was rejected without committing entries or balance changes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InsufficientBalanceError'
          examples:
            InsufficientBalance:
              $ref: '#/components/examples/InsufficientBalance'
  examples:
    CreateAlice:
      summary: Create an account
      value:
        name: Alice
    CreateBob:
      summary: Create a destination account
      value:
        name: Bob
    AccountCreated:
      summary: Generated UUID, zero balance and system time
      value:
        id: 11111111-1111-4111-8111-111111111111
        name: Alice
        balance: '0.00'
        created_at: 2026-10-28T00:00:00.000Z
    BalanceRead:
      summary: Exact committed balance
      value:
        account_id: 11111111-1111-4111-8111-111111111111
        balance: '100.00'
    CreditInput:
      summary: Credit with a supplied description
      value:
        type: credit
        amount: '100.00'
        description: Initial deposit
        reference_id: deposit-001
    DebitInput:
      summary: Debit with a generated description
      value:
        type: debit
        amount: '20.00'
        reference_id: withdrawal-001
    GeneratedCreditInput:
      summary: Integer decimal input; generated description
      value:
        type: credit
        amount: '10'
        reference_id: auto-credit-001
    CreditCreated:
      summary: Committed credit
      value:
        id: 33333333-3333-4333-8333-333333333333
        account_id: 11111111-1111-4111-8111-111111111111
        type: credit
        amount: '100.00'
        description: Initial deposit
        reference_id: deposit-001
        created_at: 2026-10-28T00:01:00.000Z
        transfer_id: null
    DebitCreated:
      summary: Committed debit with a generated description
      value:
